name: Build and Deploy to Google Play

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # 'dev', 'alpha', default to: 'stable'
        flutter-version-file: pubspec.yaml

    - name: Flutter Pub Get
      run: flutter pub get

    - name: Build AAB
      run: flutter build appbundle --release

    - name: Sign App Bundle
      uses: Tlaster/android-sign@v1   
      id: sign_app
      with:
        releaseDirectory: build/app/outputs/bundle/release/
        signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}
        alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}         
        output: build/release/signed
        keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}             
        keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    - name: Deploy to Play Store
      uses: r0adkll/upload-google-play@v1.0.18
      with:
        serviceAccountJson: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.tecbreak.beerpongapp
        releaseFiles: build/release/signed/*.aab       
        mappingFile: ./build/app/outputs/mapping/release/mapping.txt
        track: internal
        inAppUpdatePriority: 5
