name: Build and Deploy to Google Play

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable' # 'dev', 'alpha', default to: 'stable'
        flutter-version-file: pubspec.yaml

    - name: Flutter Pub Get
      run: flutter pub get

    - name: Build AAB
      run: flutter build appbundle --release

    - name: Decode keystore
      run: echo "${{ secrets.ANDROID_KEYSTORE_FILE_BASE64 }}" | base64 --decode > build/app/outputs/bundle/release/signingKey.jks

    - name: Sign AAB
      run: |
        jarsigner -verbose -sigalg SHA1withRSA -digestalg SHA1 \
          -keystore build/app/outputs/bundle/release/signingKey.jks \
          -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
          -keypass ${{ secrets.KEY_PASSWORD }} \
          -signedjar build/app/outputs/bundle/release/app-release.aab ${{ secrets.KEY_ALIAS }}

    - name: Deploy to Play Store
      uses: r0adkll/upload-google-play@v1.0.18
      with:
        serviceAccountJson: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.tecbreak.beerpongapp
        releaseFiles: ${{steps.sign_app.outputs.signedReleaseFile}}        
        mappingFile: ./build/app/outputs/mapping/release/mapping.txt
        track: internal
        inAppUpdatePriority: 5
