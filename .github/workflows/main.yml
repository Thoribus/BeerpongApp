name: Build and Deploy to Google Play

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Flutter Pub Get
      run: flutter pub get

    - name: Run Tests
      run: flutter test

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Sign App Bundle
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: build/app/outputs/bundle/release/
        signingKeyBase64: ${{ secrets.ANDROID_SIGNING_KEY }}
        alias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

    - name: Read version from pubspec.yaml
      id: version
      run: |
        VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
        BUILD_NUMBER=${{ github.run_number }}
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "build=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "full=${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT

    - name: Deploy to Play Store
      uses: r0adkll/upload-google-play@v1.0.18
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.tecbreak.beerpongcompanion
        releaseName: ${{ steps.version.outputs.name }}
        releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
        mappingFile: ./build/app/outputs/mapping/release/mapping.txt
        track: internal
        inAppUpdatePriority: 5

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: android-v${{ steps.version.outputs.full }}
        name: Android v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})
        body: |
          **Android release** — v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})
          Deployed to Google Play internal track.
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
