name: Build and Deploy to TestFlight

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Flutter Pub Get
      run: flutter pub get

    - name: Run Tests
      run: flutter test

    - name: Read version from pubspec.yaml
      id: version
      run: |
        VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
        BUILD_NUMBER=${{ github.run_number }}
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "build=$BUILD_NUMBER" >> $GITHUB_OUTPUT
        echo "full=${VERSION_NAME}+${BUILD_NUMBER}" >> $GITHUB_OUTPUT

    - name: Install Apple Distribution Certificate
      env:
        APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH \
          -P "$APPLE_CERTIFICATE_PASSWORD" \
          -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Install Provisioning Profile
      id: profile
      env:
        APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      run: |
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PP_PATH
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
        # Extract UUID so xcodebuild can reference it by name
        UUID=$(security cms -D -i "$PP_PATH" | plutil -extract UUID raw -)
        echo "uuid=$UUID" >> $GITHUB_OUTPUT
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/${UUID}.mobileprovision

    - name: Build Flutter iOS (no codesign)
      run: |
        flutter build ios --release --no-codesign --no-tree-shake-icons \
          --build-name=${{ steps.version.outputs.name }} \
          --build-number=${{ steps.version.outputs.build }}

    - name: Archive and Export IPA
      env:
        PROFILE_UUID: ${{ steps.profile.outputs.uuid }}
      run: |
        ARCHIVE_PATH=$RUNNER_TEMP/Runner.xcarchive
        EXPORT_PATH=$RUNNER_TEMP/ipa

        xcodebuild archive \
          -workspace ios/Runner.xcworkspace \
          -scheme Runner \
          -configuration Release \
          -archivePath "$ARCHIVE_PATH" \
          CODE_SIGN_STYLE=Manual \
          "PROVISIONING_PROFILE=$PROFILE_UUID" \
          CODE_SIGN_IDENTITY="Apple Distribution" \
          OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/app-signing.keychain-db" \
          IPHONEOS_DEPLOYMENT_TARGET=13.0

        # Generate ExportOptions.plist with manual signing
        cat > $RUNNER_TEMP/ExportOptions.plist << EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
            <key>method</key>
            <string>app-store</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
                <key>com.tecbreak.beerpongcompanion</key>
                <string>${PROFILE_UUID}</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadBitcode</key>
            <false/>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath "$ARCHIVE_PATH" \
          -exportPath "$EXPORT_PATH" \
          -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

    - name: Upload to TestFlight
      env:
        APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_STORE_CONNECT_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
      run: |
        KEY_PATH=$RUNNER_TEMP/AuthKey.p8
        install -m 600 /dev/null "$KEY_PATH"
        echo -n "$APP_STORE_CONNECT_KEY_P8" > "$KEY_PATH"
        xcrun altool --upload-app \
          --type ios \
          --file "$(find $RUNNER_TEMP/ipa -name "*.ipa" | head -1)" \
          --apiKey "$APP_STORE_CONNECT_KEY_ID" \
          --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
          --private-key "$KEY_PATH"

    - name: Clean up p8 key
      if: always()
      run: rm -f "$RUNNER_TEMP/AuthKey.p8"

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ios-v${{ steps.version.outputs.full }}
        name: iOS v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})
        body: |
          **iOS release** — v${{ steps.version.outputs.name }} (build ${{ steps.version.outputs.build }})
          Deployed to TestFlight. Available to testers shortly.
        files: ${{ runner.temp }}/ipa/*.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Clean up keychain
      if: always()
      run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
