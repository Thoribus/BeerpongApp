name: Deploy to Google Play

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy Android
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
    - uses: actions/checkout@v4

    - name: Install Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Flutter Pub Get
      run: flutter pub get

    - name: Read version
      id: version
      run: |
        VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
        BUILD_NUMBER=${{ github.event.workflow_run.run_number }}
        echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "build=$BUILD_NUMBER" >> $GITHUB_OUTPUT

    - name: Setup keystore
      run: |
        echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 -d > android/app/keystore.jks
        printf 'storeFile=keystore.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
          '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' \
          '${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}' \
          '${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}' \
          > android/key.properties

    - name: Build AAB
      run: flutter build appbundle --release --no-tree-shake-icons

    - name: Extract native debug symbols
      run: |
        SYMBOLS_DIR=build/app/outputs/native-debug-symbols
        mkdir -p "$SYMBOLS_DIR"
        cd build/app/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib
        zip -r "$GITHUB_WORKSPACE/$SYMBOLS_DIR/native-debug-symbols.zip" . || true

    - name: Deploy to Play Store
      uses: r0adkll/upload-google-play@v1.0.18
      with:
        serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: com.tecbreak.beerpongcompanion
        releaseName: ${{ steps.version.outputs.name }}
        releaseFiles: build/app/outputs/bundle/release/app-release.aab
        mappingFile: ./build/app/outputs/mapping/release/mapping.txt
        debugSymbols: ./build/app/outputs/native-debug-symbols/native-debug-symbols.zip
        track: internal
        inAppUpdatePriority: 5
